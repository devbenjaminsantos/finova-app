name: Build and deploy ASP.Net Core app to Azure Web App - finova-api

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "tests/**"
      - ".github/workflows/main_finova-api.yml"
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - "tests/**"
      - ".github/workflows/main_finova-api.yml"
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: finova-api
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: server/FinanceDashboard.Api/FinanceDashboard.Api.csproj
  TEST_PROJECT_PATH: tests/FinanceDashboard.Api.Tests/FinanceDashboard.Api.Tests.csproj
  PUBLISH_PATH: server/FinanceDashboard.Api/publish

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.TEST_PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration Release --no-restore

      - name: Audit dependencies
        run: dotnet list ${{ env.TEST_PROJECT_PATH }} package --vulnerable --include-transitive

      - name: Publish
        if: github.event_name != 'pull_request'
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PUBLISH_PATH }}

      - name: Deploy to Azure Web App
        if: github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}
